---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openspeedtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openspeedtest
  template:
    metadata:
      labels:
        app: openspeedtest
    spec:
      containers:
        - name: openspeedtest
          image: openspeedtest/latest:v2.0.6
          ports:
            - name: http
              containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: openspeedtest
  annotations:
    metallb.io/loadBalancerIPs: 10.255.1.0
spec:
  type: LoadBalancer
  selector:
    app: openspeedtest
  ports:
    - name: http
      port: 3000
      targetPort: http
